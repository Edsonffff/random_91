# Render deployment for the WinGo 30S + Test 7 collector.
#
# Division of responsibility:
#   - This worker        -> public.real_wingo_30s_history  (WinGo results)
#   - This worker        -> public.wingo_t7_signals        (external predictions)
#
# The same process owns both tables. It can equally be run anywhere Node
# runs (for example Termux on a phone); this blueprint just makes that the
# default. T7 predictions rotate every 30 seconds, so collection needs an
# always-on process rather than a scheduled one.
#
# Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, WINGOAI_API_TOKEN) are NOT
# stored here. Set them in the Render dashboard; `sync: false` means Render will
# not create/overwrite them from this file. The WingoAI token stays server-side
# and is never exposed to the frontend.
services:
  - type: worker
    name: wingo-t7-collector
    runtime: node
    plan: starter
    rootDir: collector
    buildCommand: npm install
    startCommand: npm start
    # The collector still binds PORT and serves /health (200 OK); that endpoint
    # is simply not health-checked by Render for a background worker.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Both history and T7 run on this loop, so it is tuned for the
      # faster of the two requirements.
      - key: POLL_INTERVAL_MS
        value: "30000"
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WINGOAI_API_TOKEN
        sync: false
